<div id="calmer-icons" class="viz-carousel" aria-label="Варианты минимального редактора" data-previous-label="Назад" data-next-label="Далее">
  <section data-variant="Монохромные" aria-label="Calmer Studio · Монохромные значки"><div class="product studio mono" aria-label="Calmer Studio · Монохромные значки"></div></section>
  <section data-variant="Цветные · vscode-icons" aria-label="Calmer Studio · vscode-icons" hidden><div class="product studio colorful" aria-label="Calmer Studio · vscode-icons"></div></section>
</div>
<style>
#calmer-icons .product{--bg:#101010;--shell:#151515;--edge:#282828;--fg:#e6e2dd;--muted:#a39ca9;--accent:#c9b7f3;--kw:#e8b4d9;--fn:#b9ddfc;--str:#d8c7f1;--row:30px;background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:570px;border:1px solid var(--edge);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;position:relative;color-scheme:dark}
#calmer-icons .product *{box-sizing:border-box}
#calmer-icons .product button{font:inherit;color:inherit;background:transparent;border:0;border-radius:5px;padding:6px 9px;display:inline-flex;align-items:center;gap:7px;text-align:left}
#calmer-icons .product button:hover{background:#ffffff0c}
#calmer-icons .product button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#calmer-icons .product button[aria-pressed=true]{background:#ffffff0c;color:var(--fg)}
#calmer-icons .top{height:48px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--shell)}
#calmer-icons .dots{display:flex;gap:7px;margin-right:10px}
#calmer-icons .dots i{display:block;width:10px;height:10px;border-radius:50%;background:#6b666a}
#calmer-icons .spacer{flex:1}
#calmer-icons .remote{color:var(--muted);white-space:nowrap}
#calmer-icons .layout{flex:1;display:flex;min-height:0}
#calmer-icons .side{width:202px;flex-shrink:0;padding:15px 12px;background:var(--shell);display:flex;flex-direction:column;gap:3px}
#calmer-icons .side .section-label{padding:12px 9px 6px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#calmer-icons .side button{min-height:var(--row);width:100%}
#calmer-icons .side .nested{padding-left:27px}
#calmer-icons .side .selected{background:#ffffff0c}
#calmer-icons .main{flex:1;min-width:0;display:flex;flex-direction:column}
#calmer-icons .tabs{display:flex;gap:6px;padding:8px 16px;min-height:43px;border-bottom:1px solid var(--edge)}
#calmer-icons .tabs button{color:var(--muted)}
#calmer-icons .code{padding:24px 22px;flex:1;min-height:0;font:14px/1.85 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}
#calmer-icons .line{display:flex;white-space:pre}
#calmer-icons .ln{color:#77717e;width:38px;flex-shrink:0;user-select:none}
#calmer-icons .kw{color:var(--kw)}
#calmer-icons .fn{color:var(--fn)}
#calmer-icons .str{color:var(--str)}
#calmer-icons .comment{color:var(--muted)}
#calmer-icons .terminal{height:136px;flex-shrink:0;border-top:1px solid var(--edge);padding:10px 22px;background:var(--bg)}
#calmer-icons .terminal[hidden],#calmer-icons .side[hidden]{display:none}
#calmer-icons .term-head{display:flex;gap:20px;align-items:center;color:var(--muted);margin-bottom:9px;font-size:12px}
#calmer-icons .term-content{font:13px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace}
#calmer-icons .prompt{color:var(--accent)}
#calmer-icons .bottom{display:flex;align-items:center;gap:12px;height:32px;padding:0 15px;color:var(--muted);background:var(--shell);font-size:11px}
#calmer-icons .bottom button{padding:2px 6px;font-size:11px}
#calmer-icons .graphite{--bg:#191919;--shell:#141414;--edge:#2a2a2a;--fg:#e3e3e3;--muted:#a0a0a0;--accent:#b9c7da;--kw:#c8b8d9;--fn:#b8cddc;--str:#cbc2d8}
#calmer-icons .graphite .side{width:224px}
#calmer-icons .graphite .tabs{border-bottom:0;padding-top:16px;color:var(--muted)}
#calmer-icons .graphite .code{padding-top:13px}
#calmer-icons .focus{--bg:#1b1918;--shell:#1b1918;--edge:#35302d;--fg:#e6ded7;--muted:#aaa09a;--accent:#d4b9a0;--kw:#d4b3c5;--fn:#bac9d8;--str:#d4c2d6}
#calmer-icons .focus .top{border-bottom:1px solid var(--edge)}
#calmer-icons .focus .code{padding:34px max(24px,calc((100% - 650px)/2));font-size:15px}
#calmer-icons .focus .terminal{padding-left:max(24px,calc((100% - 650px)/2));height:140px}
#calmer-icons .focus .bottom{background:var(--bg)}
#calmer-icons .sheet{position:absolute;top:50px;left:14px;padding:12px;width:235px;background:var(--shell);border:1px solid var(--edge);border-radius:8px;box-shadow:0 12px 32px #0008;z-index:2}
#calmer-icons .sheet[hidden]{display:none}
#calmer-icons .sheet button{display:block;width:100%}
#calmer-icons svg{width:15px;height:15px;flex-shrink:0}
#calmer-icons .file-icon{width:16px;height:16px;flex:0 0 16px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
#calmer-icons .file-icon img{display:block;width:16px;height:16px;object-fit:contain}
#calmer-icons .file-icon svg{width:16px;height:16px;stroke-width:1.6}
#calmer-icons .tree{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#413c44 transparent}
#calmer-icons .side .tree button{flex-shrink:0;min-height:30px;padding-top:5px;padding-bottom:5px;white-space:nowrap}
#calmer-icons .side .tree .nested{padding-left:27px}
#calmer-icons .tree button[hidden]{display:none}
#calmer-icons .file-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#calmer-icons .side .section-label{flex-shrink:0}
#calmer-icons .product .tree .selected{background:#ffffff0c}
@media(max-width:620px){#calmer-icons .product{height:660px}#calmer-icons .side,#calmer-icons .graphite .side{width:148px;padding:9px 5px}#calmer-icons .top{padding:0 9px;gap:4px}#calmer-icons .dots{display:none}#calmer-icons .remote{font-size:11px}#calmer-icons .code{padding:18px 10px;font-size:12px}#calmer-icons .ln{width:25px}#calmer-icons .bottom .detail{display:none}#calmer-icons .tabs{padding:6px}#calmer-icons .terminal{padding:10px;font-size:12px}}
@media(max-width:420px){#calmer-icons .side,#calmer-icons .graphite .side{width:116px;font-size:11px}#calmer-icons .side .nested{padding-left:16px}#calmer-icons .remote{display:none}#calmer-icons .top{font-size:12px}#calmer-icons .focus .code{padding-left:14px;font-size:12px}}
</style>

(()=>{

app.querySelector('.workspace').onclick=()=>{if(!sheet.hidden){sheet.hidden=true}else showSheet('workspace');app.querySelector('.workspace').setAttribute('aria-expanded',String(!sheet.hidden))};
app.querySelector('.git').onclick=()=>showSheet('git');

app.querySelector('.close-terminal').onclick=()=>app.querySelector('.terminal').hidden=true;
app.querySelector('.toggle-terminal').onclick=()=>{const t=app.querySelector('.terminal');t.hidden=!t.hidden};

const color=app.classList.contains('colorful');
function fileIcon(key,monoName){return '<span class="file-icon" aria-hidden="true">'+(color?'<img src="'+assets[key]+'" alt="">':icon(monoName))+'</span>'}
const files=[
 {name:'main.go',key:'go',mono:'file-code-2',nested:true},
 {name:'worker.rs',key:'rust',mono:'file-code-2',nested:true},
 {name:'app.ts',key:'typescript',mono:'file-code-2',nested:true},
 {name:'config.py',key:'python',mono:'file-code-2',nested:true},
 {name:'assets',key:'assets',mono:'folder',folder:true},
 {name:'go.mod',key:'go-package',mono:'package'},
 {name:'package.json',key:'npm',mono:'file-json'},
 {name:'.gitignore',key:'git',mono:'git-branch'},
 {name:'README.md',key:'markdown',mono:'file-text'}
];
const side=app.querySelector('.side');
side.querySelectorAll('button:not(.find):not(.git)').forEach(el=>el.remove());
const tree=document.createElement('div');tree.className='tree';tree.setAttribute('aria-label','Файлы проекта');
tree.innerHTML='<button class="folder-row cursor-interaction" aria-expanded="true">'+icon('chevron-down')+fileIcon('src-open','folder-open')+'<span class="file-label">src</span></button>'+files.map(f=>'<button class="tree-file cursor-interaction '+(f.nested?'nested ':'')+(f.name==='main.go'?'selected':'')+'" data-name="'+f.name+'"'+(f.folder?' aria-expanded="false"':'')+'>'+fileIcon(f.key,f.mono)+'<span class="file-label">'+f.name+'</span></button>').join('');
side.querySelector('.section-label').after(tree);
app.querySelectorAll('.tabs .file').forEach(b=>{b.insertAdjacentHTML('afterbegin',fileIcon('go','file-code-2'))});
app.querySelector('.workspace [data-lucide="folder"]').outerHTML=fileIcon('folder','folder');
const demo={
 'main.go':source,
 'config.go':['<span class="kw">package</span> main','','<span class="kw">const</span> host = <span class="str">"dev-server"</span>'],
 'worker.rs':['<span class="kw">fn</span> <span class="fn">main</span>() {','    <span class="fn">println!</span>(<span class="str">"Hello, fieldnotes"</span>);','}'],
 'app.ts':['<span class="kw">const</span> project = <span class="str">"fieldnotes"</span>;','','<span class="kw">export function</span> <span class="fn">openProject</span>() {','    <span class="kw">return</span> project;','}'],
 'config.py':['project = <span class="str">"fieldnotes"</span>','host = <span class="str">"dev-server"</span>'],
 'go.mod':['module fieldnotes','','go 1.24'],
 'package.json':['{','    <span class="str">"name"</span>: <span class="str">"fieldnotes"</span>,','    <span class="str">"private"</span>: <span class="kw">true</span>','}'],
 '.gitignore':['node_modules/','dist/','.DS_Store'],
 'README.md':['<span class="comment"># Fieldnotes</span>','','A small workspace.'],
 'styles.css':[':root {','    color: <span class="str">#e6e2dd</span>;','    background: <span class="str">#101010</span>;','}']
};
function openFile(name){
app.querySelector('.code').innerHTML=demo[name].map((s,i)=>'<div class="line"><span class="ln">'+(i+1)+'</span><span>'+s+'</span></div>').join('');
tree.querySelectorAll('.tree-file').forEach(b=>b.classList.toggle('selected',b.dataset.name===name));
let tabs=app.querySelector('.tabs');
let active=[...tabs.querySelectorAll('.file')].find(b=>b.dataset.file===name);
if(!active){active=tabs.querySelector('.file');active.dataset.file=name;let f=files.find(f=>f.name===name)||{key:'css',mono:'file-code-2'};active.innerHTML=fileIcon(f.key,f.mono)+'<span class="file-label">'+name+'</span>';if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}})}
tabs.querySelectorAll('.file').forEach(b=>b.setAttribute('aria-pressed',String(b===active)));
}
tree.querySelector('.folder-row').onclick=function(){const closed=this.getAttribute('aria-expanded')==='true';this.setAttribute('aria-expanded',String(!closed));tree.querySelectorAll('.nested').forEach(b=>b.hidden=closed);this.innerHTML=icon(closed?'chevron-right':'chevron-down')+fileIcon(closed?'src':'src-open',closed?'folder':'folder-open')+'<span class="file-label">src</span>';if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}})};
tree.querySelectorAll('.tree-file').forEach(b=>b.onclick=()=>{if(b.dataset.name==='assets'){const existing=tree.querySelector('[data-name="styles.css"]');if(existing){existing.remove();b.setAttribute('aria-expanded','false')}else{const child=document.createElement('button');child.className='tree-file nested cursor-interaction';child.dataset.name='styles.css';child.innerHTML=fileIcon('css','file-code-2')+'<span class="file-label">styles.css</span>';child.onclick=()=>openFile('styles.css');b.after(child);b.setAttribute('aria-expanded','true');if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}})}}else openFile(b.dataset.name)});
app.querySelectorAll('.tabs .file').forEach(b=>b.onclick=()=>openFile(b.dataset.file));
const findButton=app.querySelector('.find');findButton.onclick=()=>{sheet.hidden=false;sheet.innerHTML='<span>Быстрый переход</span>'+files.filter(f=>!f.folder).map(f=>'<button class="cursor-interaction" data-name="'+f.name+'">'+fileIcon(f.key,f.mono)+' '+f.name+'</button>').join('');sheet.querySelectorAll('button').forEach(b=>b.onclick=()=>{openFile(b.dataset.name);sheet.hidden=true});if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}})};
const state={iconSize:16};
if(globalThis.Tweak){const t=new Tweak({container:app,onChange:()=>app.querySelectorAll('.file-icon,.file-icon img,.file-icon svg').forEach(el=>{el.style.width=state.iconSize+'px';el.style.height=state.iconSize+'px';if(el.classList.contains('file-icon'))el.style.flexBasis=state.iconSize+'px'})});t.addSlider(state,'iconSize',{label:'Размер значков',min:14,max:20,unit:'px'})}
});
if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});
})();
</script>
